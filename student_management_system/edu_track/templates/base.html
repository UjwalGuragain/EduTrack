{% load static %}

<!DOCTYPE html>
<html>
<head>

  <meta charset="utf-8">
  <title>EduTrack</title>

  <!-- AdminLTE CSS -->
  <link rel="stylesheet" href="{% static 'adminlte/dist/css/adminlte.min.css' %}">
  <link rel="stylesheet" href="{% static 'adminlte/plugins/fontawesome-free/css/all.min.css' %}">

</head>

<body class="hold-transition sidebar-mini">

<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">

    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a>
      </li>
    </ul>

  </nav>

  <!-- Sidebar -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">

    <a href="#" class="brand-link">
      <span class="brand-text font-weight-light">EduTrack</span>
    </a>

    <div class="sidebar">

      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column">

          <li class="nav-item">
            <a href="{% url 'dashboard' %}" class="nav-link">
              <i class="nav-icon fas fa-home"></i>
              <p>Dashboard</p>
            </a>
          </li>

          <li class="nav-item">
            <a href="{% url 'student_list' %}" class="nav-link">
              <i class="nav-icon fas fa-user"></i>
              <p>Students</p>
            </a>
          </li>

          <li class="nav-item">
            <a href="{% url 'course_list' %}" class="nav-link">
              <i class="nav-icon fas fa-book"></i>
              <p>Courses</p>
            </a>
          </li>

          <li class="nav-item">
            <a href="{% url 'module_list' %}" class="nav-link">
              <i class="nav-icon fas fa-book-open"></i>
              <p>Modules</p>
            </a>
          </li>

          <li class="nav-item">
            <a href="{% url 'attendance_list' %}" class="nav-link">
              <i class="nav-icon fas fa-check"></i>
              <p>Attendance</p>
            </a>
          </li>

          <li class="nav-item">
            <a href="{% url 'result_list' %}" class="nav-link">
              <i class="nav-icon fas fa-chart-bar"></i>
              <p>Results</p>
            </a>
          </li>

        </ul>
      </nav>

    </div>

  </aside>

  <!-- Content -->
  <div class="content-wrapper p-3">

    {% block content %}
    {% endblock %}

  </div>

</div>

<!-- JS -->
<script src="{% static 'adminlte/plugins/jquery/jquery.min.js' %}"></script>
<script src="{% static 'adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'adminlte/dist/js/adminlte.min.js' %}"></script>

</body>
</html>
