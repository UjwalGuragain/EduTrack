{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card card-primary card-outline">

            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-camera mr-2"></i>
                    Change Profile Picture
                </h3>
            </div>

            <form method="post" enctype="multipart/form-data" id="picture-form">

                {% csrf_token %}

                <div class="card-body text-center">

                    <div class="profile-pic-container mb-4">
                        {% if picture %}
                            <img src="{{ picture.url }}"
                                 class="img-circle elevation-2"
                                 width="150"
                                 height="150"
                                 style="object-fit: cover;"
                                 id="current-pic">
                        {% else %}
                            <i class="fas fa-user-circle text-secondary"
                               style="font-size:150px;"
                               id="default-icon"></i>
                        {% endif %}
                    </div>

                    <div class="form-group text-left">

                        <label class="d-block">Select a new profile picture</label>

                        <div class="input-group">
                            <div class="custom-file">
                                <input type="file"
                                       name="profile_picture"
                                       accept="image/jpeg,image/jpg,image/png"
                                       class="custom-file-input"
                                       id="profilePicture">
                                <label class="custom-file-label" for="profilePicture">Choose file</label>
                            </div>
                        </div>

                        <small class="form-text text-muted">
                            Supported formats: JPG, JPEG, PNG
                        </small>

                    </div>

                </div>

                <div class="card-footer">

                    <div class="d-flex justify-content-between">

                        <a href="{{ request.META.HTTP_REFERER|default:'/' }}"
                           class="btn btn-default">
                            <i class="fas fa-times mr-1"></i>
                            Cancel
                        </a>

                        <button type="submit"
                                class="btn btn-primary">
                            <i class="fas fa-upload mr-1"></i>
                            Upload
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

<script>
document.querySelector('.custom-file-input').addEventListener('change', function(e) {
    var fileName = e.target.files[0].name;
    e.target.nextElementSibling.innerText = fileName;
});
</script>

{% endblock %}
