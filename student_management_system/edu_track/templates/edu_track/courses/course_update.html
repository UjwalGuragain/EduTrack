{% extends 'base.html' %}
{% block content %}

<div class = "card">
  <div class = "card-header">
    <h1 class = "card-title">Update Course</h1>
    <div class= "card-tools">
      <a href="{% url 'course_list' %}" class="btn btn-sm btn-secondary">Back to Courses</a>
    </div>
  </div>

  <form method="post" action="{% url 'course_update' course.id %}">
    {% csrf_token %}

    <div class = "card-body">

      <div class = "form-group">
        <label for="id_course_code">Course Code:</label>
        <input id="id_course_code" type="text" name="course_code" class="form-control" value="{{ course.course_code }}" required />
        
      <div class = "form-group">
        <label for="id_course_name">Course Name:</label>
        <input id="id_course_name" type="text" name="course_name" class="form-control" value="{{ course.course_name }}" required />
      </div>

      <div class = "form-group">
        <label for="id_course_duration">Course Duration:</label>
        <select id="id_course_duration" name="course_duration" class="form-control" required>
          {% for value, year in duration_choices %}
            <option value="{{ value }}" {% if course.course_duration == value %}selected{% endif %}>{{ year }}</option>
          {% endfor %}
        </select>
      </div>

      <div class = "card-footer">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
      </div>

    </div>
  
  </form>
</div>

{% endblock %}
