{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update Course</title>
</head>
<body>
  <h1>Update Course</h1>

  <form method="post" action="{% url 'course_update' course.id %}">
    {% csrf_token %}

    <div>
      <label for="id_course_name">Course Name:</label>
      <input id="id_course_name" type="text" name="course_name" value="{{ course.course_name }}" required />
    </div>

    <div>
      <label for="id_course_duration">Course Duration:</label>
      <select id="id_course_duration" name="course_duration" required>
        <option value="1" {% if course.course_duration == 1 %}selected{% endif %}>1 Year</option>
        <option value="2" {% if course.course_duration == 2 %}selected{% endif %}>2 Years</option>
        <option value="3" {% if course.course_duration == 3 %}selected{% endif %}>3 Years</option>
        <option value="4" {% if course.course_duration == 4 %}selected{% endif %}>4 Years</option>
        <option value="5" {% if course.course_duration == 5 %}selected{% endif %}>5 years</option>
      </select>
    </div>

    <div style="margin-top: 12px;">
      <button type="submit">Save</button>
      <a href="{% url 'course_list' %}">Cancel</a>
    </div>
  </form>
</body>
</html>
