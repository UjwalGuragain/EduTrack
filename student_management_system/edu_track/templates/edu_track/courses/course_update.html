{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update Course</title>
</head>
<body>
  <h1>Update Course</h1>

  <form method="post" action="{% url 'course_update' course.id %}">
    {% csrf_token %}

    <div>
      <label for="id_course_name">Course Name:</label>
      <input id="id_course_name" type="text" name="course_name" value="{{ course.course_name }}" required />
    </div>

    <div>
      <label for="id_course_duration">Course Duration:</label>
      <select id="id_course_duration" name="course_duration" required>
        {% for value, year in duration_choices %}
          <option value="{{ value }}" {% if course.course_duration == value %}selected{% endif %}>
            {{ year }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div style="margin-top: 12px;">
      <button type="submit">Save</button>
      <a href="{% url 'course_list' %}">Cancel</a>
    </div>
  </form>
</body>
</html>
