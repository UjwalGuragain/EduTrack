{% extends 'base.html' %}
{% block content %}

<div class = "card">
  <div class = "card-header">
    <h1 class = "card-title">Add Course</h1>
    <div class= "card-tools">
      <a href="{% url 'course_list' %}" class="btn btn-sm btn-secondary">Back to Courses</a>
    </div>
  </div>

  <form method="post" action="{% url 'course_add' %}">
    {% csrf_token %}

    <div class = "card-body">

      <div class = "form-group">
        <label for="id_course_code">Course Code:</label>
        <input id="id_course_code" type="text" name="course_code" class="form-control" required />
      </div>

      <div class = "form-group">
        <label for="id_course_name">Course Name:</label>
        <input id="id_course_name" type="text" name="course_name" class="form-control" required />
      </div>

      <div class = "form-group">
        <label for="id_course_duration">Course Duration:</label>
        <select id="id_course_duration" name="course_duration" class="form-control" required>
          {% for value,label in duration_choices %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class = "card-footer" style="margin-top: 12px;">
        <button type="submit" class="btn btn-primary">Create</button>
        <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
      </div>

    </div>
  </form>
</div>

{% endblock %}
