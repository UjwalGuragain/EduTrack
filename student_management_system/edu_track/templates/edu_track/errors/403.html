{% extends 'authbase.html' %}
{% block content %}
<div class="login-box">
    <div class="card card-outline card-warning">
        <div class="card-header text-center">
            <a href="#" class="h1"><b>Edu</b>Track</a>
        </div>
        <div class="card-body">
            <p class="login-box-msg text-center">
                <i class="fas fa-lock text-warning" style="font-size: 3rem;"></i>
            </p>
            <h3 class="text-center font-weight-bold" style="font-size: 2.5rem;">403</h3>
            <p class="text-center">Access denied</p>
            <p class="text-center text-muted">You do not have permission to view this resource. If you believe this is a mistake, contact your administrator.</p>
            <div class="row">
                <div class="col-12">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-block">Back to Safety</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
