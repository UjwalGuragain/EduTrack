{% extends 'base.html' %}
{% block content %}

<div class = "card">
  <div class = "card-header">
    <h1 class = "card-title">Update Student</h1>
    <div class = "card-tools">
      <a href="{% url 'student_list' %}" class="btn btn-secondary">Back to Students</a>
    </div>
  </div>
  <form method="post" action="{% url 'student_update' student.id %}">
    {% csrf_token %}
  <div class = "card-body">
    <div class = "form-group">
      <label for="id_full_name">Full Name:</label>
      <input id="id_full_name" type="text" name="full_name" class= "form-control" value="{{ student.full_name }}" required />
    </div>

    <div class = "form-group">
      <label for="id_address">Address:</label>
      <input id="id_address" type="text" name="address" class="form-control" value="{{ student.address }}" required />
    </div>

    <div class = "form-group">
      <label for="id_contact_number">Contact Number:</label>
      <input id="id_contact_number" type="text" name="contact_number" class="form-control" value="{{ student.contact_number }}" required maxlength="10" />
    </div>

    <div class = "form-group">
      <label for="id_email">Email:</label>
      <input id="id_email" type="email" name="email" class="form-control" value="{{ student.email }}" required />
    </div>

    <div class = "form-group">
      <label for="id_guardian_name">Guardian Name:</label>
      <input id="id_guardian_name" type="text" name="guardian_name" class="form-control" value="{{ student.guardian_name }}" required />
    </div>

    <div class = "form-group">
      <label for="id_enrollment_number">Enrollment Number:</label>
      <input id="id_enrollment_number" type="text" name="enrollment_number" class="form-control" value="{{ student.enrollment_number }}" required />
    </div>

    <div class = "form-group">
      <label for="id_enrolled_course">Enrolled Course:</label>
      <select id="id_enrolled_course" name="enrolled_course" class="form-control" required>
        {% for c in courses %}
          <option value="{{ c.id }}" {% if student.enrolled_course.id == c.id %}selected{% endif %}>
            {{ c.course_name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class = "form-group">
      <label for="id_enrollment_date">Enrollment Date:</label>
      <input id="id_enrollment_date" type="date" name="enrollment_date" class="form-control" value="{{ student.enrollment_date|date:'Y-m-d' }}" required />
    </div>

    <div class = "card-footer">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </div>
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}" style='color:red'>{{ message }}</div>
    {% endfor %}
  </form>
</div>
{% endblock %}
