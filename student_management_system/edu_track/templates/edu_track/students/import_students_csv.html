{% extends 'base.html' %}
{% block content %}

<div class="card card-primary">
    <div class="card-header">
        <h3 class="card-title">
            <i class="fas fa-file-upload mr-2"></i>
            Import Students from CSV
        </h3>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="card-body">
            <div class="form-group">
                <label>Select CSV File</label>
                <div class="input-group">
                    <div class="custom-file">
                        <input type="file" name="csv_file" accept=".csv" class="custom-file-input" id="csvFile" required>
                        <label class="custom-file-label" for="csvFile">Choose file</label>
                    </div>
                </div>
                <small class="text-muted">Only .csv files are accepted</small>
            </div>

            <div class="callout callout-info">
                <h5>Expected CSV Columns:</h5>
                <ul class="mb-0">
                    <li>Full Name</li>
                    <li>Address</li>
                    <li>Contact Number</li>
                    <li>Email</li>
                    <li>Guardian Name</li>
                    <li>Enrollment Number</li>
                    <li>Enrolled Course</li>
                    <li>Enrollment Date</li>
                </ul>
            </div>
        </div>

        <div class="card-footer">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-upload"></i>
                Import Students
            </button>
            <a href="{% url 'student_list' %}" class="btn btn-secondary ml-2">
                Cancel
            </a>
        </div>
    </form>
</div>
<script>
document.querySelector('.custom-file-input').addEventListener('change', function(e) {
    var fileName = e.target.files[0].name;
    e.target.nextElementSibling.innerText = fileName;
});
</script>
{% endblock %}
