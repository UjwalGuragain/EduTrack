{% extends 'base.html' %}
{% block content %}

<div class = "card">
  <div class = "card-header">
    <h1 class = "card-title">Add Module</h1>
    <div class= "card-tools">
      <a href="{% url 'module_list' %}" class="btn btn-sm btn-secondary">Back to Modules</a>
    </div>
  </div>

  <form method="post" action="{% url 'module_add' %}">
    {% csrf_token %}

    <div class = "card-body">

      <div class = "form-group">
        <label for="id_module_code">Module Code:</label>
        <input id="id_module_code" type="text" name="module_code" class="form-control" required />
      </div>

      <div class = "form-group">
        <label for="id_module_name">Module Name:</label>
        <input id="id_module_name" type="text" name="module_name" class="form-control" required />
      </div>

      <div class = "form-group">
        <label for="id_full_marks">Full Marks:</label>
        <input id="id_full_marks" type="number" name="full_marks" class="form-control" step="0.01" required />
      </div>

      <div class = "form-group">
              <label for="id_semester">Semester:</label>
              <select id="id_semester" name="semester" class="form-control" required>
                {% for s in semesters %}
                  <option value="{{ s.id }}">
                    {{ s.course.course_name }} - Year {{ s.year_level }} Semester {{ s.semester_number }} ({{ s.academic_year.year_label }})
                  </option>
                {% endfor %}
              </select>
            </div>

    </div>

    <div class = "card-footer">
      <button type="submit" class="btn btn-primary">Create</button>
      <a href="{% url 'module_list' %}" class="btn btn-secondary">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
