{% extends 'base.html' %}
{% block content %}

<div class = "card">
  <div class = "card-header">
    <h1 class = "card-title">Update Module</h1>
    <div class= "card-tools">
      <a href="{% url 'module_list' %}" class="btn btn-sm btn-secondary">Back to Modules</a>
    </div>
  </div>

  <form method="post" action="{% url 'module_update' module.id %}">
    {% csrf_token %}

    <div class = "card-body">

      <div class = "form-group">
        <label for="id_module_name">Module Name:</label>
        <input id="id_module_name" type="text" name="module_name" class="form-control" value="{{ module.module_name }}" required />
      </div>

      <div class = "form-group">
        <label for="id_full_marks">Full Marks:</label>
        <input id="id_full_marks" type="number" name="full_marks" class="form-control" step="0.01" value="{{ module.full_marks }}" required />
      </div>

      <div class = "form-group">
        <label for="id_courses">Course:</label>
        <select id="id_courses" name="courses" class="form-control" required>
          {% for c in courses %}
            <option value="{{ c.id }}" {% if module.courses.id == c.id %}selected{% endif %}>
              {{ c.course_name }}
            </option>
          {% endfor %}
        </select>
      </div>

    </div>

    <div class = "card-footer">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'module_list' %}" class="btn btn-secondary">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
