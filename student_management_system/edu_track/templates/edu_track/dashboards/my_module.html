{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <div class="d-flex align-items-center justify-content-between w-100">
                    <h3 class="card-title mb-0">My Modules</h3>
                    <div class="text-muted" style="font-size: 0.95rem;">
                        <i class="fas fa-user mr-1"></i>
                        {{ student.user }}
                    </div>
                </div>
            </div>

            <div class="card-body">
                {% if module %}
                <table class="table table-bordered table-striped">
                    <thead>
                        <tr>
                            <th>Module Code</th>
                            <th>Module Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for record in module %}
                        <tr>
                            <td>{{ record.module.module_code }}</td>
                            <td>{{ record.module.module_name }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}
                <p>No modules available.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>

{% endblock %}
