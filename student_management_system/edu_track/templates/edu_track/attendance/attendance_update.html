{% extends 'base.html' %}
{% block content %}

<div class = "card">
  <div class = "card-header">
    <h1 class = "card-title">Update Attendance</h1>
    <div class= "card-tools">
      <a href="{% url 'attendance_list' %}" class="btn btn-sm btn-secondary">Back to Attendance</a>
    </div>
  </div>

  <form method="post" action="{% url 'attendance_update' attendance.id %}">
    {% csrf_token %}

    <div class = "card-body">

      <div class = "form-group">
        <label for="student">Student:</label>
        <select name="student" id="student" class="form-control" required>
          {% for s in student %}
            <option value="{{ s.id }}" {% if attendance and attendance.student.id == s.id %}selected{% endif %}>
              {{ s.full_name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class = "form-group">
        <label for="date">Date:</label>
        <input type="date" name="date" id="date" class="form-control" value="{{ attendance.date|date:'Y-m-d' }}" required />
      </div>

      <div class = "form-group">
        <label for="status">Status:</label>
        <select name="status" id="status" class="form-control" required>
          {% if status_choices %}
            {% for value,label in status_choices %}
              <option value="{{ value }}" {% if attendance and attendance.status == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          {% else %}
            <option value="Present" {% if attendance and attendance.status == 'Present' %}selected{% endif %}>Present</option>
            <option value="Absent" {% if attendance and attendance.status == 'Absent' %}selected{% endif %}>Absent</option>
          {% endif %}
        </select>
      </div>

    </div>

    <div class = "card-footer">
      <button type="submit" class="btn btn-primary">Update</button>
      <a href="{% url 'attendance_list' %}" class="btn btn-secondary">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
