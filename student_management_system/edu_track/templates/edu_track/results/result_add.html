{% extends 'base.html' %}
{% block content %}

<div class = "card">
  <div class = "card-header">
    <h1 class = "card-title">Add Result</h1>
    <div class = "card-tools">
      <a href="{% url 'result_list' %}" class="btn btn-secondary">Back to Results</a>
    </div>
  </div>

  <form method="post" action="">
    {% csrf_token %}
    <div class = "card-body">
    <div class = "form-group">
      <label for="student">Student:</label>
      <select name="student" id="student" class = "form-control" required>
        {% for s in student %}
          <option value="{{ s.id }}">{{ s.full_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class = "form-group">
      <label for="module">Module:</label>
      <select name="module" id="module" class = "form-control" required>
        {% for m in modules %}
          <option value="{{ m.id }}">{{ m.module_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class = "form-group">
      <label for="obtained_marks">Obtained Marks:</label>
      <input type="number" step="0.01" name="obtained_marks" id="obtained_marks" class = "form-control" required />
    </div>

    <div class = "card-footer" style="margin-top: 12px;">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'result_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
    </div>
  </form>
</div>
{% endblock %}
