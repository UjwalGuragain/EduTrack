{% extends 'base.html' %}
{% block content %}

<div class = "card">
  <div class = "card-header">
    <h1 class = "card-title">Update Result</h1>
    <div class = "card-tools">
      <a href="{% url 'result_list' %}" class="btn btn-secondary">Back to Results</a>
    </div>
  </div>
  <form method="post" action="{% url 'result_update' results.id %}">
    {% csrf_token %}
  <div class = "card-body">
    <div class = "form-group">
      <label for="student">Student:</label>
      <select name="student" id="student" class = "form-control" required>
        {% for s in students %}
          <option value="{{ s.id }}" {% if results and results.student.id == s.id %}selected{% endif %}>{{ s.full_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class = "form-group">
      <label for="module">Module:</label>
      <select name="module" id="module" class = "form-control" required>
        {% for m in modules %}
          <option value="{{ m.id }}" {% if results and results.module.id == m.id %}selected{% endif %}>{{ m.module_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class = "form-group">
      <label for="obtained_marks">Obtained Marks:</label>
      <input type="number" step="0.01" class= "form-control" name="obtained_marks" id="obtained_marks" value="{{ results.obtained_marks }}" required />
    </div>
    
    <div class = "card-footer">
      <button type="submit" class="btn btn-primary">Update</button>
      <a href="{% url 'result_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </div>
  </form>
</div>
{% endblock %}
