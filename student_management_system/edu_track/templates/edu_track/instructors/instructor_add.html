{% extends 'base.html' %}
{% block content %}

<div class="card">
    <div class="card-header">
        <h1 class="card-title">Add Instructor</h1>
        <div class="card-tools">
            <a href="{% url 'instructor_list' %}" class="btn btn-sm btn-secondary">Back to Instructors</a>
        </div>
    </div>

    <form method="post" action="{% url 'instructor_add' %}">
        {% csrf_token %}
        <div class="card-body">

            <div class="form-group">
                <label for="id_user">Linked User:</label>
                <select id="id_user" name="user" class="form-control">
                    <option value="">-- Select an available user --</option>
                    {% for user in users %}
                        <option value="{{ user.id }}">{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="id_full_name">Full Name:</label>
                <input id="id_full_name" type="text" name="full_name" class="form-control" required />
            </div>

            <div class="form-group">
                <label for="id_contact_number">Contact Number:</label>
                <input id="id_contact_number" type="text" name="contact_number" class="form-control" required />
            </div>

            <div class="form-group">
                <label for="id_email">Email:</label>
                <input id="id_email" type="email" name="email" class="form-control" required />
            </div>

            <div class="form-group">
                <label for="id_address">Address:</label>
                <textarea id="id_address" name="address" class="form-control" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="id_qualification">Qualification:</label>
                <input id="id_qualification" type="text" name="qualification" class="form-control" required />
            </div>

        </div>

        <div class="card-footer" style="margin-top: 12px;">
            <button type="submit" class="btn btn-primary">Create</button>
            <a href="{% url 'instructor_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
